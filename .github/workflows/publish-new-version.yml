name: Publish new version

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install dependencies
        uses: bahmutov/npm-install@20216767ca67f0f7b4d095dc5859c5700a6581cb # v1.12.1
      - name: Get original package info
        id: originalPackageInfo
        uses: gregoranders/nodejs-project-info@2708b2315a68f7070cccff1362e5fbf05584b9a7 # v0.0.21
      - name: Add Changeset
        uses: ianwalter/add-changeset@b134b46d61041218a68dc3dd8580019aa51f5e9d # v3.0.0
        with:
          type: patch
      - name: Apply changeset
        uses: Borales/actions-yarn@3766bb1335b98fb13c60eaf358fe20811b730a88 # v5.0.0
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
        with:
          cmd: changeset version
      - name: git Actions
        uses: srt32/git-actions@e958482c32696439aff04bc931155b00e2551474 # v0.0.3
        with:
          cmd: add .
      - name: Get updated package info
        id: updatedPackageInfo
        uses: gregoranders/nodejs-project-info@2708b2315a68f7070cccff1362e5fbf05584b9a7 # v0.0.21
      - name: Add & Commit
        uses: EndBug/add-and-commit@290ea2c423ad77ca9c62ae0f5b224379612c0321 # v10.0.0
        if: ${{ steps.originalPackageInfo.outputs.version != steps.updatedPackageInfo.outputs.version }}
        with:
          add: '.'
          message: v${{ steps.updatedPackageInfo.outputs.version }}
          tag: v${{ steps.updatedPackageInfo.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to npm
        uses: Borales/actions-yarn@3766bb1335b98fb13c60eaf358fe20811b730a88 # v5.0.0
        if: ${{ steps.originalPackageInfo.outputs.version != steps.updatedPackageInfo.outputs.version }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
        with:
          cmd: publish
      - name: Disable main branch protection
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        if: ${{ steps.originalPackageInfo.outputs.version != steps.updatedPackageInfo.outputs.version }}
        with:
          github-token: ${{ secrets.BRANCH_PROTECTION_GITHUB_TOKEN }}
          script: |
            github.repos.updateBranchProtection({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'main',
              required_status_checks: null,
              enforce_admins: null,
              required_pull_request_reviews: null,
              restrictions: null,
            })
      - name: GitHub Push
        uses: ad-m/github-push-action@77c5b412c50b723d2a4fbc6d71fb5723bcd439aa # v1.0.0
        if: ${{ steps.originalPackageInfo.outputs.version != steps.updatedPackageInfo.outputs.version }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
          tags: true
      - name: Enable main branch protection
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        if: ${{ steps.originalPackageInfo.outputs.version != steps.updatedPackageInfo.outputs.version }}
        with:
          github-token: ${{ secrets.BRANCH_PROTECTION_GITHUB_TOKEN }}
          script: |
            github.repos.updateBranchProtection({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'main',
              required_status_checks: {
                strict: true,
                contexts: ['lint', 'prettify', 'test'],
              },
              enforce_admins: null,
              required_pull_request_reviews: null,
              restrictions: null,
            })
